<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프로젝트 · IrisGUI</title>
<style>
  :root {
    --bg: #12141C; --bg2: #171922; --panel: #1D2028; --panel2: #232630;
    --line: #2C3040; --line2: #3A3F52;
    --ink: #EAECF5; --sub: #8D93AB; --dim: #5C6180;
    --accent: #7AA2F7; --accent-ink: #0E1017;
    --green: #4EC9A0; --orange: #E3A05A; --red: #E2707A; --violet: #B48EF5;
    --radius: 14px;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background:
      radial-gradient(1100px 600px at 12% -10%, #1E2333 0%, rgba(30,35,51,0) 60%),
      radial-gradient(800px 500px at 100% 0%, #1A2130 0%, rgba(26,33,48,0) 55%),
      var(--bg);
    color: var(--ink);
    font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 clamp(14px, 4vw, 40px) 64px;
  }
  a { color: inherit; }

  /* ── header ── */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 26px 2px 20px; border-bottom: 1px solid var(--line); margin-bottom: 26px;
  }
  .mark { display: flex; align-items: center; gap: 11px; }
  .glyph {
    width: 38px; height: 38px; border-radius: 12px; flex: 0 0 38px;
    background: linear-gradient(140deg, var(--accent) 0%, var(--violet) 100%);
    box-shadow: 0 6px 20px rgba(122,162,247,.28);
    display: grid; place-items: center; color: var(--accent-ink);
    font-weight: 800; font-size: 17px; letter-spacing: -.5px;
  }
  .mark h1 { font-size: 16px; font-weight: 650; letter-spacing: -.2px; }
  .mark .sub { font-size: 11.5px; color: var(--sub); margin-top: 1px; }
  .spacer { flex: 1 1 auto; }
  .host {
    font: 11.5px/1.4 var(--mono); color: var(--sub); text-align: right;
    padding: 6px 11px; border: 1px solid var(--line); border-radius: 10px;
    background: rgba(255,255,255,.02);
  }
  .host b { color: var(--ink); font-weight: 600; }

  /* ── layout ── */
  main { max-width: 1080px; margin: 0 auto; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }

  section.title {
    display: flex; align-items: baseline; gap: 10px; margin: 0 2px 14px;
  }
  section.title h2 { font-size: 13px; font-weight: 650; letter-spacing: .4px; text-transform: uppercase; color: var(--sub); }
  .count {
    font: 11px/1 var(--mono); color: var(--accent); background: rgba(122,162,247,.1);
    border: 1px solid rgba(122,162,247,.25); padding: 4px 8px; border-radius: 999px;
  }
  .ghost {
    border: 1px solid var(--line); background: transparent; color: var(--sub);
    font-size: 12.5px; padding: 7px 13px; border-radius: 10px; cursor: pointer;
    transition: .16s; font-family: inherit;
  }
  .ghost:hover { color: var(--ink); border-color: var(--line2); background: rgba(255,255,255,.03); }

  /* ── card ── */
  .card {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--panel2) 0%, var(--panel) 100%);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 16px 14px; box-shadow: var(--shadow);
    transition: transform .18s ease, border-color .18s ease;
    text-decoration: none; display: block; color: inherit;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--line2); }
  .card::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0; transition: opacity .2s;
  }
  .card:hover::after { opacity: .6; }
  .card.run { border-color: rgba(78,201,160,.35); }
  .card.run::after { background: linear-gradient(90deg, transparent, var(--green), transparent); opacity: .5; }
  .card.warn { border-color: rgba(227,160,90,.35); }

  .row { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: 0 0 8px; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(78,201,160,.16); }
  .dot.wait { background: var(--orange); box-shadow: 0 0 0 3px rgba(227,160,90,.16);
    animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
  .name { font-size: 16px; font-weight: 650; letter-spacing: -.2px; word-break: break-all; }
  .badge {
    margin-left: auto; font: 10.5px/1 var(--mono); letter-spacing: .3px;
    padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line);
    color: var(--sub); background: rgba(255,255,255,.03); white-space: nowrap;
  }
  .badge.on { color: var(--green); border-color: rgba(78,201,160,.3); background: rgba(78,201,160,.09); }
  .badge.wait { color: var(--orange); border-color: rgba(227,160,90,.3); background: rgba(227,160,90,.09); }
  .badge.err { color: var(--red); border-color: rgba(226,112,122,.3); background: rgba(226,112,122,.09); }

  .path {
    margin: 11px 0 13px; font: 11px/1.5 var(--mono); color: var(--dim);
    padding: 7px 10px; border-radius: 8px; background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.03);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .note { font-size: 11.5px; color: var(--orange); margin: -4px 0 12px; }

  .acts { display: flex; gap: 8px; }
  .btn {
    flex: 1 1 auto; border: 1px solid var(--line); background: rgba(255,255,255,.03);
    color: var(--ink); font: 600 12.5px/1 inherit; font-family: inherit;
    padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: .16s;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .btn:hover { border-color: var(--line2); background: rgba(255,255,255,.06); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.go:hover { filter: brightness(1.08); background: var(--accent); }
  .btn.stop { color: var(--red); border-color: rgba(226,112,122,.3); }
  .btn.stop:hover { background: rgba(226,112,122,.1); }
  .btn svg { width: 13px; height: 13px; }

  /* ── new project ── */
  .newwrap {
    margin-top: 26px; padding: 18px; border: 1px dashed var(--line2);
    border-radius: var(--radius); background: rgba(255,255,255,.015);
  }
  .newwrap h3 { font-size: 13.5px; font-weight: 650; margin-bottom: 4px; }
  .newwrap p { font-size: 12px; color: var(--sub); margin-bottom: 13px; }
  .newform { display: flex; gap: 9px; flex-wrap: wrap; }
  input {
    flex: 1 1 240px; min-width: 0; background: rgba(0,0,0,.3); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
    font: 13px/1.2 var(--mono); font-family: inherit; outline: none; transition: .16s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(122,162,247,.14); }
  input::placeholder { color: var(--dim); }
  .hint { font-size: 11px; color: var(--dim); margin-top: 9px; }

  /* ── states ── */
  .empty {
    grid-column: 1 / -1; text-align: center; padding: 54px 20px;
    border: 1px dashed var(--line); border-radius: var(--radius); color: var(--sub);
  }
  .empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 6px; font-weight: 600; }
  .sk { height: 108px; border-radius: var(--radius); border: 1px solid var(--line);
    background: linear-gradient(90deg, var(--panel) 25%, var(--panel2) 50%, var(--panel) 75%);
    background-size: 300% 100%; animation: sh 1.3s infinite; }
  @keyframes sh { to { background-position: -300% 0 } }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 24px);
    background: #0B0D14; border: 1px solid var(--line2); color: var(--ink);
    padding: 11px 17px; border-radius: 11px; font-size: 12.5px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: .22s; z-index: 20; max-width: 88vw;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { border-color: rgba(226,112,122,.5); }

  footer {
    max-width: 1080px; margin: 30px auto 0; padding-top: 16px;
    border-top: 1px solid var(--line); font-size: 11px; color: var(--dim);
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  footer code { font-family: var(--mono); color: var(--sub); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="mark">
    <div class="glyph">I</div>
    <div>
      <h1>IrisGUI 편집기</h1>
      <div class="sub">기기 안 Linux 의 스크립트 프로젝트</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="host" id="host">—</div>
</header>

<main>
  <section class="title">
    <h2>프로젝트</h2>
    <span class="count" id="count">&hellip;</span>
    <div class="spacer"></div>
    <button class="ghost" id="refresh" type="button">고침</button>
  </section>

  <div class="grid" id="grid"></div>

  <div class="newwrap">
    <h3>새 프로젝트</h3>
    <p>폴더가 만들어지고 <code style="font-family:var(--mono)">main.py</code> 샘플과 가상환경(venv)이 자동으로 따라 붙습니다.</p>
    <div class="newform">
      <input id="newname" placeholder="project-name" autocomplete="off" spellcheck="false" maxlength="64">
      <button class="btn go" id="create" type="button" style="flex:0 0 auto;padding:11px 20px">만들기</button>
    </div>
    <div class="hint">문자·숫자·<code style="font-family:var(--mono)">-</code>·<code style="font-family:var(--mono)">_</code> 만 허용 (1~64자). 이미 있으면 알려줍니다.</div>
  </div>
</main>

<footer>
  <span>실행 중인 프로젝트는 <code>/ws</code> 로 같은 이벤트를 함께 받습니다.</span>
  <span id="root"></span>
</footer>

<div id="toast"></div>

<script>
(function () {
  'use strict';
  var grid = document.getElementById('grid'),
      count = document.getElementById('count'),
      toast = document.getElementById('toast'),
      input = document.getElementById('newname'),
      btnNew = document.getElementById('create'),
      timer = null;

  var ICON = {
    play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 4.5v15l12-7.5z" stroke-linejoin="round"/></svg>',
    stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4l10-10-4-4L4 16v4z"/></svg>',
    spin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="9" stroke-opacity=".25"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>'
  };

  function say(msg, isErr) {
    toast.textContent = msg;
    toast.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(say.t);
    say.t = setTimeout(function () { toast.className = isErr ? 'err' : ''; }, 3600);
  }

  var API = '/editor/projects';
  function get(url) {
    return fetch(url, { headers: { accept: 'application/json' } })
      .then(function (r) { return r.json(); });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function card(p) {
    var el = document.createElement('div');
    var state = p.error ? 'err' : (p.running ? 'on' : (p.pending ? 'wait' : 'off'));
    var badge = p.error ? '<span class="badge err">오류</span>'
      : p.running ? '<span class="badge on">실행 중' + (p.pid ? ' · ' + p.pid : '') + '</span>'
      : p.pending ? '<span class="badge wait">준비 중</span>'
      : '<span class="badge">정지됨</span>';
    el.className = 'card' + (p.running ? ' run' : (p.error ? ' warn' : ''));
    el.innerHTML =
      '<div class="row"><span class="dot ' + (p.running ? 'on' : (p.pending ? 'wait' : '')) + '"></span>' +
      '<span class="name">' + esc(p.name) + '</span>' + badge + '</div>' +
      '<div class="path">' + esc(p.guest || '') + '/main.py</div>' +
      (p.error ? '<div class="note">' + esc(p.error) + '</div>' : '') +
      '<div class="acts">' +
        '<a class="btn go" href="/editor?project=' + encodeURIComponent(p.name) + '">' +
          ICON.edit + '편집</a>' +
        '<button class="btn ' + (p.running ? 'stop' : '') + '" data-act="' +
          (p.running ? 'stop' : 'run') + '" data-name="' + esc(p.name) + '">' +
          (p.running ? ICON.stop + '정지' : ICON.play + '실행') + '</button>' +
      '</div>';
    return el;
  }

  function render(data) {
    if (!data || !data.ok) {
      grid.innerHTML = '<div class="empty"><b>목록을 읽지 못했습니다</b>' +
        esc(data && data.message ? data.message : '앱의 편집기 서버에 접속할 수 없습니다') + '</div>';
      count.textContent = '—';
      return;
    }
    var list = data.projects || [];
    count.textContent = list.length + '개';
    document.getElementById('root').textContent = data.projectsRoot ? '경로 ' + data.projectsRoot : '';
    if (!list.length) {
      grid.innerHTML = '<div class="empty"><b>아직 프로젝트가 없습니다</b>' +
        '아래에서 첫 프로젝트를 만들어 보세요. <code style="font-family:var(--mono)">main.py</code> 샘플까지 세팅됩니다.</div>';
      return;
    }
    grid.innerHTML = '';
    list.forEach(function (p) { grid.appendChild(card(p)); });
  }

  function load() {
    return get(API).then(render).catch(function (e) { render({ ok: false, message: String(e) }); });
  }

  grid.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button[data-act]') : null;
    if (!b) return;
    ev.preventDefault();
    var name = b.getAttribute('data-name'), act = b.getAttribute('data-act');
    b.disabled = true;
    b.innerHTML = ICON.spin + '대기';
    fetch(API + '/' + encodeURIComponent(name) + '/' + act, { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok === false) say(d.message || '실패', true); })
      .catch(function (e) { say(String(e), true); })
      .then(load);
    // 상태 반영은 좀 느릴 수 있다(run 은 venv 대기 등)— 잠시 뒤 한 번 더 본다.
    setTimeout(load, 1600);
    setTimeout(load, 4000);
  });

  function create() {
    var name = (input.value || '').trim();
    if (!name) { say('이름을 적어 주세요', true); input.focus(); return; }
    btnNew.disabled = true;
    btnNew.innerHTML = ICON.spin + '만드는 중';
    fetch(API, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name: name })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok) {
        input.value = '';
        say(name + ' 생성됨 — 가상환경이 잠시 뒤 준비됩니다');
        setTimeout(function () { location.href = '/editor?project=' + encodeURIComponent(name); }, 700);
      } else {
        say((d && d.message) || '생성 실패', true);
      }
    }).catch(function (e) { say(String(e), true); })
      .then(function () {
        btnNew.disabled = false;
        btnNew.innerHTML = '만들기';
        load();
      });
  }

  btnNew.addEventListener('click', create);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') create(); });
  document.getElementById('refresh').addEventListener('click', function () { load(); });

  document.getElementById('host').innerHTML =
    '<b>' + esc(location.host) + '</b><br>' + esc(navigator.userAgent.indexOf('Mobile') >= 0 ? 'mobile' : 'desktop') + ' · ' +
    new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

  grid.innerHTML = '<div class="sk"></div><div class="sk"></div>';
  load();
  timer = setInterval(load, 3000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearInterval(timer); timer = null; }
    else { load(); timer = setInterval(load, 3000); }
  });
})();
</script>
</body>
</html>
